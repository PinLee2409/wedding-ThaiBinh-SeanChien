<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B2A4A" />

    <!-- Primary meta -->
    <title>Thái Bình &amp; Sean Chien · Thiệp cưới</title>
    <meta
      name="description"
      content="Thiệp cưới của Thái Bình và Sean Chien — trân trọng kính mời Quý khách cùng chung vui trong ngày trọng đại."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Thái Bình &amp; Sean Chien · Save the Date" />
    <meta
      property="og:description"
      content="Trân trọng kính mời Quý khách đến chung vui trong ngày trọng đại của Thái Bình và Sean Chien."
    />
    <!-- The cover photograph from the hero, copied into public/ under a stable
         name: everything under src/assets/ is renamed with a content hash at
         build time, so it has no address a scraper could be given.
         %SITE_URL% is filled in at build time from `site.publicUrl`, so each
         repository points at its own deployment — Facebook, Zalo and Messenger
         will not resolve a relative image URL. -->
    <meta property="og:image" content="%SITE_URL%images/web/og-cover.jpg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="2400" />
    <meta property="og:image:alt" content="Thiệp cưới Thái Bình và Sean Chien" />
    <meta property="og:locale" content="vi_VN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Thái Bình &amp; Sean Chien · Save the Date" />
    <meta
      name="twitter:description"
      content="Thái Bình và Sean Chien trân trọng kính mời Quý khách cùng chung vui trong ngày trọng đại."
    />
    <meta name="twitter:image" content="%SITE_URL%images/web/og-cover.jpg" />

    <!-- Fonts are served from this site — see the @font-face block at the top
         of src/index.css. Nothing is fetched from Google, so the invitation
         renders identically on every device, works on a poor connection, and
         reports nothing about a guest's visit to a third party. Same-origin
         also means the boarding-pass PNG/PDF export can read the rules it
         needs to embed the faces. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
